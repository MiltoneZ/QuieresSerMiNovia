<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¿Quieres ser mi novia?</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <input type="checkbox" id="si-toggle" class="toggle" />

  <main class="card">
    <header class="title">
      <h1><span class="hi">Hola Preciosa</span> 🤍</h1>
      <p class="subtitle">Te quiero preguntar una cosa muy importante!</p>
    </header>

    <section class="content">
      <img src="https://i.ibb.co/JFQrF5vf/Copia-de-Agregar-un-Historia-para-Instagram-Amor-y-Mascotas-Collage-Marr-n-claro-y-Rojo.png" alt="Nosotros" class="photo">
      <h2 class="question">¿Puedo ser tu novio?</h2>
      <p class="note">Yo Recorro El Horizonte Por Verte Feliz 💘</p>

      <div class="actions">
        <label for="si-toggle" class="btn yes" id="yesBtn">Sí, ¡claro! 💞</label>
        <button id="noBtn" class="btn no">No… 😅</button>
      </div>
    </section>
  </main>

  <div class="overlay">
    <div class="celebrate">
      <h3>¡TE AMO HERMOSA! 💍</h3>
      <p>Gracias por hacerme el hombre mas feliz del mundo! 💖</p>
      <label for="si-toggle" class="btn close">Cerrar</label>
    </div>
  </div>

  <!-- Música -->
  <audio id="loveMusic" src="music.mp3" preload="auto" loop></audio>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const toggle = document.getElementById('si-toggle');
    const music = document.getElementById('loveMusic');

    // Config música: arranca en 13s, volumen 0 → 0.5
    music.volume = 0;
    music.currentTime = 13;

    // Mostrar toast cuando termina el fade-in
    function showMusicToast() {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = '🎵 Canción para <strong>Angelina Alarcón</strong> activada ✨';
      document.body.appendChild(t);
      // se remueve cuando termina la animación
      t.addEventListener('animationend', () => t.remove());
    }

    // Fade-in que devuelve una Promesa y al final dispara el toast
    function fadeInMusic(targetVolume = 0.5, duration = 6000) {
      return new Promise(resolve => {
        const step = targetVolume / (duration / 100);
        const id = setInterval(() => {
          if (music.volume < targetVolume) {
            music.volume = Math.min(music.volume + step, targetVolume);
          } else {
            clearInterval(id);
            resolve();
          }
        }, 100);
      }).then(showMusicToast);
    }

    // Botón "No" escurridizo
    const frases = [
      "¿Segura? 😳","Piénsalo bien 😏","No puedes decir que no 🥺",
      "¡Ay no! 😭","Intenta alcanzarme 😜","Ni lo sueñes 😂",
      "Casi me atrapas 😆","¡Corre tras de mí! 💨","Di que sí mejor 💘","No hay escapatoria 😈"
    ];
    const colores = ["#ef4444","#f97316","#eab308","#22c55e","#3b82f6","#a855f7","#ec4899","#14b8a6","#f43f5e"];

    noBtn.addEventListener("mouseenter", () => {
      const x = Math.random() * (window.innerWidth - noBtn.clientWidth);
      const y = Math.random() * (window.innerHeight - noBtn.clientHeight);
      noBtn.style.position = "fixed";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      const frase = frases[Math.floor(Math.random() * frases.length)];
      const color = colores[Math.floor(Math.random() * colores.length)];
      noBtn.textContent = frase;
      noBtn.style.background = color;
      noBtn.style.color = "#fff";
    });

    // Corazones flotantes constantes
    function startFloatingHeartsContinuous() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('float-heart');
        heart.textContent = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (16 + Math.random() * 24) + 'px';
        heart.style.animationDuration = (4 + Math.random() * 3) + 's';
        document.body.appendChild(heart);
        heart.addEventListener('animationend', () => heart.remove());
      }, 350);
    }

    // Intento de autoplay; si falla, arranca tras el primer clic
	function tryAutoplayMusic() {
  // Mostrar el toast y arrancar el fade-in en cuanto el audio realmente empiece
  music.addEventListener('playing', () => {
    showMusicToast();          // ← aparece justo cuando inicia
    fadeInMusic(0.5, 6000);    // ← inicia el fade-in de 0 → 0.5 (6s)
  }, { once: true });

  // Intento de reproducción al cargar
  const startPlayback = () => {
    // Asegura arranque en 13s y volumen 0 solo la primera vez
    if (music.currentTime < 12.5) music.currentTime = 13;
    music.volume = 0;
    const p = music.play();
    if (p && typeof p.catch === 'function') {
      p.catch(() => {/* bloqueado por navegador, se resolverá con el clic */});
    }
  };

  startPlayback();

  // Si el navegador bloquea el autoplay, arrancará con el primer clic
  document.addEventListener('click', () => startPlayback(), { once: true });
}

    // Efecto asombroso al dar "Sí"
    yesBtn.addEventListener('click', (e) => {
      for (let i = 0; i < 120; i++) {
        const particle = document.createElement('span');
        particle.classList.add('particle');
        particle.textContent = ['❤️','💖','💞','💘','✨'][Math.floor(Math.random()*5)];
        document.body.appendChild(particle);
        const x = e.clientX + (Math.random() - 0.5) * 400;
        const y = e.clientY + (Math.random() - 0.5) * 300;
        particle.style.setProperty('--x', `${x}px`);
        particle.style.setProperty('--y', `${y}px`);
        particle.style.animation = 'explode 1.5s ease-out forwards';
        setTimeout(() => particle.remove(), 1500);
      }
    });

    // Corazones extra al marcar "Sí"
    toggle.addEventListener('change', () => {
      if (toggle.checked) {
        const burst = setInterval(() => {
          const heart = document.createElement('div');
          heart.classList.add('float-heart');
          heart.textContent = '❤️';
          document.body.appendChild(heart);
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.animationDuration = (3 + Math.random() * 2) + 's';
          setTimeout(() => heart.remove(), 6500);
        }, 150);
        setTimeout(() => clearInterval(burst), 4000);
      }
    });

    // Al entrar a la página…
    window.addEventListener('load', () => {
      startFloatingHeartsContinuous();
      tryAutoplayMusic();
    });

// ...tu código previo...

// 💫 Animación de salida al cerrar el cuadro de "Sí"
const closeBtn = document.querySelector('.btn.close');
const overlay = document.querySelector('.overlay');
const celebrateBox = document.querySelector('.celebrate');

function spawnLoveHearts(count=10){
  for(let i=0;i<count;i++){
    const h = document.createElement('div');
    h.className = 'love-heart';
    h.textContent = Math.random() < 0.75 ? '❤️' : '💖';
    // dispersión horizontal alrededor del centro
    const offset = (Math.random() - 0.5) * 220; // px
    h.style.left = `calc(50% + ${offset}px)`;
    h.style.animationDuration = (2 + Math.random()*1.2) + 's';
    document.body.appendChild(h);
    h.addEventListener('animationend', ()=> h.remove());
  }
}

function showLoveNote(){
  const note = document.createElement('div');
  note.className = 'love-note';
  note.innerHTML = 'Te amo, <strong>Angelina</strong> 💖';
  document.body.appendChild(note);
  note.addEventListener('animationend', ()=> note.remove());
}

if (closeBtn) {
  closeBtn.addEventListener('click', () => {
    // salida suave del cuadro y del overlay
    celebrateBox.classList.add('fade-out');
    overlay.style.animation = 'fadeOutOverlay 0.5s ease forwards';

    // 💞 dispara el mensajito y corazones
    showLoveNote();
    spawnLoveHearts(12);

    // oculta el overlay después de la animación
    setTimeout(() => {
      document.getElementById('si-toggle').checked = false;
      celebrateBox.classList.remove('fade-out');
    }, 500);
  });
}
</script>

</script>
</body>
</html>
